# Render Blueprint. In the Render dashboard: New -> Blueprint -> point at
# this repo, and Render provisions all three resources below together with
# the env vars wired between them automatically.
#
# You still need to fill in secrets (GROQ_API_KEY, SMTP_*, IMAP_*, API_KEY)
# in the Render dashboard after the first deploy -- see the README's
# "Deploying to Render" section for exactly which ones and how to generate
# API_KEY.

databases:
  - name: mailer-agent-db
    plan: starter          # paid tier -- free Postgres on Render is deleted
                            # after ~30 days and isn't meant for production
    databaseName: mailer_agent
    user: mailer_agent

services:
  - type: web
    name: mailer-agent-api
    runtime: python
    plan: starter           # paid tier -- avoids the 15-min free-tier spin-down
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn mailer_agent.api.main:app -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mailer-agent-db
          property: connectionString
      - key: RUN_SCHEDULER_IN_PROCESS
        value: "false"       # the separate background worker below owns the scheduler
      - key: LIVE_SENDING_ENABLED
        value: "false"        # flip to true only after reviewing draft output
      - key: AUTO_REPLY_ENABLED
        value: "false"
      - key: API_KEY
        sync: false           # set manually in the dashboard -- see README
      - key: MAILBOX_ENCRYPTION_KEY
        sync: false           # Fernet key for mailbox SMTP/IMAP credentials. Set the SAME value
                              # on mailer-agent-api and mailer-agent-worker; losing or changing it
                              # makes stored mailbox credentials unreadable. See README.
      - key: ORG_KEY_MAP
        sync: false           # JSON {"<api_key>":"<org_id>"}: one key per tenant (LeadBoost L1 needs one
                              # per LeadBoost organization). API service only. Never commit values.
      - key: LEADBOOST_INTEGRATION_SENDER_EMAIL
        sync: false           # REQUIRED for LeadBoost generated outreach: the first dispatch per organization
                              # returns 503 while this is empty (deployment-wide campaign sender identity).
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false

  - type: worker
    name: mailer-agent-worker
    runtime: python
    plan: starter            # background workers are not available on the free tier
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    # worker.py drains in-flight external dispatches for up to
    # EXTERNAL_DISPATCH_SHUTDOWN_DRAIN_SECONDS (25 s by default), then moves any
    # it still owns SENDING -> UNKNOWN and releases claims. Render's default grace
    # after SIGTERM is 30 s, leaving ~5 s of margin; 60 s makes the ordered
    # shutdown the normal path instead of a race against SIGKILL. (A SIGKILL
    # mid-drain is still safe -- lease recovery resolves expired SENDING to
    # UNKNOWN, never QUEUED -- but it is avoidable.)
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mailer-agent-db
          property: connectionString
      - key: LIVE_SENDING_ENABLED
        value: "false"
      - key: AUTO_REPLY_ENABLED
        value: "false"
      - key: MAILBOX_ENCRYPTION_KEY
        sync: false           # Fernet key for mailbox SMTP/IMAP credentials. Set the SAME value
                              # on mailer-agent-api and mailer-agent-worker; losing or changing it
                              # makes stored mailbox credentials unreadable. See README.
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false
