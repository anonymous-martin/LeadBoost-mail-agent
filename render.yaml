# Render Blueprint -- Mailer Agent, first production deployment.
#
# This manifest creates exactly TWO Render resources:
#   * mailer-agent-api     web service (HTTP API, no scheduler)
#   * mailer-agent-worker  background worker (the one and only scheduler / dispatcher)
#
# It deliberately does NOT provision a database. The production database is a
# DEDICATED Supabase project/PostgreSQL owned by the Mailer (never LeadBoost's
# database). Its connection string is supplied out of band in the Render
# dashboard (`sync: false`): it must be copied from that project's own Connect
# screen and set to the EXACT SAME value on BOTH services. Never put it, a
# password, or any other secret in this file. See docs/C13_DEPLOYMENT_RUNBOOK.md
# section 0 ("First deployment") for the full procedure, including the guarded
# database migration that must be run BEFORE live traffic is allowed.
#
# Every `sync: false` below is a value the operator types into the dashboard
# when the Blueprint is created (or afterwards). Nothing here generates secrets:
# in particular MAILBOX_ENCRYPTION_KEY is NOT `generateValue`d, because Render
# would generate an independent value per service and the two must be identical.

services:
  - type: web
    name: mailer-agent-api
    region: singapore
    runtime: python
    plan: starter           # paid tier -- avoids the 15-min free-tier spin-down
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn mailer_agent.api.main:app -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false           # Mailer's dedicated Supabase PostgreSQL URL, copied from that project's
                              # Connect screen. SAME value as on mailer-agent-worker. Never LeadBoost's
                              # database. Never commit it. See runbook section 0.
      - key: RUN_SCHEDULER_IN_PROCESS
        value: "false"        # the separate background worker below owns the scheduler
      - key: LIVE_SENDING_ENABLED
        value: "false"        # stays false until the separate controlled acceptance step
      - key: AUTO_REPLY_ENABLED
        value: "false"        # stays false until the separate controlled acceptance step
      - key: API_DOCS_ENABLED
        value: "false"        # /docs, /redoc and /openapi.json answer 404; when enabled they are unauthenticated
      - key: MAILBOX_ENCRYPTION_KEY
        sync: false           # Fernet key for mailbox SMTP/IMAP credentials. Set the SAME value
                              # on mailer-agent-api and mailer-agent-worker; losing or changing it
                              # makes stored mailbox credentials unreadable. Keep an offline backup
                              # separate from the database backup. See runbook section 4.
      - key: ORG_KEY_MAP
        sync: false           # JSON {"<mailer_tenant_api_key>":"<mailer_org_id>"}: one key per tenant
                              # (LeadBoost holds the inverse map per LeadBoost organization). API service
                              # only. REQUIRED: with no key the API refuses to start. Never commit values.
                              # The legacy global API_KEY is intentionally NOT declared in this profile.
      - key: SYSTEM_OPERATOR_API_KEY
        sync: false           # Operator-only credential for /system/config, /system/metrics/llm and
                              # /system/integration/validate (X-System-Operator-Key). API service ONLY.
                              # Must differ from every tenant key or the API refuses to start.
      - key: LEADBOOST_INTEGRATION_SENDER_EMAIL
        sync: false           # REQUIRED for LeadBoost generated outreach: the first dispatch per organization
                              # returns 503 while this is empty (deployment-wide campaign sender identity).
      - key: GROQ_API_KEY
        sync: false

  - type: worker
    name: mailer-agent-worker
    region: singapore
    runtime: python
    plan: starter            # background workers are not available on the free tier
    numInstances: 1       # Exactly one scheduler/dispatcher worker.
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    # Exactly ONE worker service, and it must stay at a single instance: it owns the scheduler.
    # worker.py drains in-flight external dispatches for up to
    # EXTERNAL_DISPATCH_SHUTDOWN_DRAIN_SECONDS (25 s by default), then moves any
    # it still owns SENDING -> UNKNOWN and releases claims. Render's default grace
    # after SIGTERM is 30 s, leaving ~5 s of margin; 60 s makes the ordered
    # shutdown the normal path instead of a race against SIGKILL. (A SIGKILL
    # mid-drain is still safe -- lease recovery resolves expired SENDING to
    # UNKNOWN, never QUEUED -- but it is avoidable.)
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false           # EXACTLY the same Mailer Supabase URL as mailer-agent-api. See runbook section 0.
      - key: LIVE_SENDING_ENABLED
        value: "false"        # decides dispatch on the worker; stays false until controlled acceptance
      - key: AUTO_REPLY_ENABLED
        value: "false"
      - key: MAILBOX_ENCRYPTION_KEY
        sync: false           # Fernet key for mailbox SMTP/IMAP credentials. Set the SAME value
                              # on mailer-agent-api and mailer-agent-worker; losing or changing it
                              # makes stored mailbox credentials unreadable. See runbook section 4.
      - key: GROQ_API_KEY
        sync: false
