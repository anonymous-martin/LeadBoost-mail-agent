name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, grounding-state-fix]

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR instead of letting them pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt-and-braces: these already default to false in mailer_agent/config.py,
  # and CI never checks out a .env file (it's gitignored), but every job sets
  # them explicitly anyway so no normal test run can ever send real email or
  # auto-send a reply, regardless of future defaults.
  LIVE_SENDING_ENABLED: "false"
  AUTO_REPLY_ENABLED: "false"

# Runner image is deliberately pinned (every job below uses ubuntu-24.04, never ubuntu-latest) so the
# PostgreSQL / SMTP / Dovecot-IMAP integration jobs run on a known OS image. Moving to a newer image
# should be an intentional, tested change to these labels, not an automatic `ubuntu-latest` migration.
jobs:
  quality-and-tests:
    name: Quality & deterministic tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CI-only tooling (lint / security / coverage)
        run: pip install "pytest-cov>=5.0" "ruff>=0.6" "bandit>=1.7" "pip-audit>=2.7"

      - name: Compile / import sanity check
        run: python -m compileall -q mailer_agent tests

      - name: Lint (ruff, report-only)
        # Pre-existing lint debt (mostly unused imports/vars) predates this
        # workflow; enforcing it now would fail CI on unrelated findings
        # rather than a real regression. Reported every run, not blocking.
        # --exit-zero always exits 0; if/when the codebase is cleaned up,
        # drop that flag to make it a real gate.
        run: ruff check --exit-zero mailer_agent tests

      - name: Dependency sanity (pip check)
        run: pip check

      - name: Dependency vulnerability scan (pip-audit, report-only)
        # Informational: currently flags known CVEs in transitive deps
        # (pytest, starlette) pulled in by the pinned FastAPI range.
        # Bumping those is an application dependency decision, not a
        # CI-infrastructure one, so this reports rather than blocks.
        run: pip-audit -r requirements.txt || true

      - name: Security scan (bandit, report-only)
        run: bandit -r mailer_agent -q || true

      - name: Run deterministic test suite
        run: |
          python -m pytest -q \
            --cov=mailer_agent --cov-report=term-missing --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: junit.xml
          retention-days: 14

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          # Disposable, CI-only credentials for an ephemeral service
          # container -- never used outside this job's network namespace.
          POSTGRES_USER: mailer_agent
          POSTGRES_PASSWORD: mailer_agent_test_pw
          POSTGRES_DB: mailer_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailer_agent -d mailer_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL integration suite
        env:
          # Explicit +psycopg2 driver is required: the pinned SQLAlchemy
          # 2.x range resolves a bare postgresql:// URL to the psycopg
          # (v3) dialect, which isn't installed here (only psycopg2-binary
          # is, per requirements.txt). Without this, the whole suite
          # silently SKIPS (reported not-available) instead of running.
          POSTGRES_TEST_URL: postgresql+psycopg2://mailer_agent:mailer_agent_test_pw@localhost:5432/mailer_agent_test
        run: |
          python -m pytest -o addopts="" \
            tests/test_external_dispatch_postgres.py \
            tests/test_leadboost_generated_outreach_postgres.py \
            tests/test_postgresql_concurrency.py \
            tests/test_m3_inbound_postgres.py \
            tests/test_leadboost_reconciliation_postgres.py \
            tests/test_leadboost_conversation_postgres.py -v

      # C13: the REAL scripts/migrate_release.sh and the REAL migration scripts,
      # run against a database the test creates and drops itself
      # (mailer_migrate_test_<random> on this job's own service container).
      # REQUIRE_MIGRATION_WRAPPER_PG=1 turns a missing/unreachable PostgreSQL
      # into a hard failure -- this step can never "pass" by skipping.
      - name: Migration wrapper against disposable PostgreSQL
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://mailer_agent:mailer_agent_test_pw@localhost:5432/mailer_agent_test
          REQUIRE_MIGRATION_WRAPPER_PG: "1"
        run: |
          bash -n scripts/migrate_release.sh
          python -m pytest -o addopts="" tests/test_migrate_release.py -v

      # PR 3: several REAL processes start together against empty / already-migrated disposable
      # databases (init_db advisory lock; SCHEMA_INIT_MODE=verify). REQUIRE_SCHEMA_INIT_PG=1 makes a
      # missing PostgreSQL a hard failure, so this step can never "pass" by skipping.
      - name: Concurrent schema initialization against disposable PostgreSQL
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://mailer_agent:mailer_agent_test_pw@localhost:5432/mailer_agent_test
          REQUIRE_SCHEMA_INIT_PG: "1"
        run: |
          python -m pytest -o addopts="" tests/test_schema_init.py -v

      # PR4 operator observability: migration 010 on a fresh and an already-migrated disposable database,
      # idempotency, read-only verify, downgrade touching no business data, aggregate semantics on real
      # timestamptz/timestamp columns, the recovery-sweep cross-check, and the EXPLAIN plans behind the
      # index review. REQUIRE_PR4_OBSERVABILITY_PG=1 turns a missing/unreachable PostgreSQL into a hard
      # FAILURE, never a skip.
      - name: Operator observability against disposable PostgreSQL
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://mailer_agent:mailer_agent_test_pw@localhost:5432/mailer_agent_test
          REQUIRE_PR4_OBSERVABILITY_PG: "1"
        run: |
          python -m pytest -o addopts="" tests/test_pr4_observability_postgres.py -v

  local-smtp:
    name: Local SMTP protocol integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run local SMTP integration test
        # No external network access is used or required -- this test
        # spins up a real aiosmtpd server on localhost only.
        run: |
          python -m pytest -o addopts="" tests/test_smtp_local_integration.py -v


  m3-imap-e2e:
    name: M3 real IMAP end-to-end + C12 full chain (disposable Dovecot / SMTP, PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      # Both Dovecot suites pick PostgreSQL up via POSTGRES_TEST_URL; the C12
      # full-chain test requires it whenever it is set (no silent SQLite fallback).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mailer_agent
          POSTGRES_PASSWORD: mailer_agent_test_pw
          POSTGRES_DB: mailer_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailer_agent -d mailer_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install a disposable IMAP server
        # Throw-away local Dovecot on 127.0.0.1 with a self-signed cert and
        # generated accounts; no external network or real mailbox is used.
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dovecot-imapd
          sudo systemctl stop dovecot || true

      - name: Run M3 IMAP end-to-end + C12 full-chain tests
        # Root is needed so Dovecot can drop to its service users.
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://mailer_agent:mailer_agent_test_pw@localhost:5432/mailer_agent_test
          C12_ALLOW_DESTRUCTIVE_TEST_DB: "1"
        run: |
          sudo -E env \
            "PATH=$PATH" \
            "DATABASE_URL=$POSTGRES_TEST_URL" \
            "POSTGRES_TEST_URL=$POSTGRES_TEST_URL" \
            "C12_ALLOW_DESTRUCTIVE_TEST_DB=$C12_ALLOW_DESTRUCTIVE_TEST_DB" \
            python -m pytest -o addopts="" tests/test_m3_imap_e2e.py tests/test_c12_chain_smtp_imap.py -v
